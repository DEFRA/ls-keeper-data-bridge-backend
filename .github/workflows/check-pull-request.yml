name: Check Pull Request

on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions: {}

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      - name: Check out code
        uses: actions/checkout@v3
        with:
          path: working-dir
      - name: Restore
        run: dotnet restore ./working-dir/KeeperData.Bridge.sln
      - name: Build
        run: dotnet build ./working-dir/KeeperData.Bridge.sln --configuration Release --no-restore -warnaserror
      - name: Test (unit and component)
        run: dotnet test ./working-dir/KeeperData.Bridge.sln --filter "Dependence!=docker&testtype!=performance" --logger "GitHubActions;summary.includePassedTests=true;summary.includeSkippedTests=true" --collect:"XPlat Code Coverage" --results-directory ./coverage
      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool
      - name: Generate Coverage Summary
        run: |
          reportgenerator \
            -reports:"./coverage/**/coverage.cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"Cobertura;MarkdownSummary" \
            -assemblyfilters:+KeeperData.*
      - name: Code coverage report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage-report/Cobertura.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 80'
      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md

  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: pr-validator
    steps:
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      - name: Check out code
        uses: actions/checkout@v3
        with:
          path: working-dir

      # Third-party images are pinned, so cache them as a tarball keyed on the exact tags.
      # A cache hit turns a ~400MB Docker Hub pull into a local load.
      - name: Cache docker images
        id: image-cache
        uses: actions/cache@v4
        with:
          path: ~/.docker-images/images.tar
          key: docker-images-localstack-3.0.2-mongo-6.0.13-redis-7.2.3-alpine3.18

      - name: Load cached docker images
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: docker load -i ~/.docker-images/images.tar

      - name: Pull and save docker images
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: |
          docker pull localstack/localstack:3.0.2
          docker pull mongo:6.0.13
          docker pull redis:7.2.3-alpine3.18
          mkdir -p ~/.docker-images
          docker save -o ~/.docker-images/images.tar \
            localstack/localstack:3.0.2 \
            mongo:6.0.13 \
            redis:7.2.3-alpine3.18

      # Build the app image with a layer cache. Compose's "--build" has no cache and redoes the
      # full dotnet restore/publish every run. The GHA build cache is a separate pool from
      # actions/cache, so it does not consume the cache size budget.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build keeperdata_bridge image
        uses: docker/build-push-action@v6
        with:
          context: ./working-dir
          file: ./working-dir/Dockerfile
          tags: keeperdata_bridge:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make LocalStack init script executable
        run: chmod +x ./working-dir/compose/start-localstack.sh

      - name: Run docker-compose
        uses: hoverkraft-tech/compose-action@v2.0.1
        with:
          compose-file: |
            ./working-dir/docker-compose.yml
            ./working-dir/docker-compose.ci.yml
          up-flags: "--no-build"

      - name: Make script executable
        run: chmod +x ./working-dir/wait-for-docker-logs.sh
      - name: Wait for localstack
        run: ./working-dir/wait-for-docker-logs.sh kdb-localstack-emulator "Ready." 60
      - name: Wait for keeperdata_bridge to be ready
        run: ./working-dir/wait-for-docker-logs.sh keeperdata_bridge "Now listening on" 60
      - name: Run integration tests
        run: dotnet test ./working-dir/KeeperData.Bridge.sln --filter "Dependence=docker&testtype!=performance"

  sonarcloud-scan:
    name: CDP SonarCloud Scan
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    uses: ./.github/workflows/sonarcloud.yml
    needs: pr-validator
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
